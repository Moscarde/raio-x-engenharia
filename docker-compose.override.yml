# Sobrescreve, só para o container do scheduler (onde as tasks das DAGs
# rodam, LocalExecutor), as variáveis POSTGRES_HOST/POSTGRES_PORT que o
# Astro CLI injeta a partir do .env. O .env é pensado para execução manual
# fora do container (collector rodado via `python -m ...` do host, onde o
# Postgres está em localhost:<porta publicada>); dentro da rede docker do
# Airflow, o Postgres é alcançável pelo hostname de serviço "postgres" na
# porta interna 5432. Ver docs/COLLECTOR_TEMPLATE.md e CLAUDE.md.
services:
  scheduler:
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
