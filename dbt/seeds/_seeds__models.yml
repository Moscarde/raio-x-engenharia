version: 2

seeds:
  - name: seed_cnes_natureza_juridica
    description: >
      De-para do código NAT_JUR (natureza_juridica) do CNES para descrição
      legível. Fonte: Receita Federal, "Tabela II - Natureza Jurídica e
      Qualificação do Responsável"
      (https://www38.receita.fazenda.gov.br/cadsincnac/jsp/coleta/ajuda/topicos/Tabela_II_-_Natureza_Juridica_e_Qualificacao_do_Responsavel.htm),
      consultada em 2026-07-04. Cobertura: 22 dos 25 códigos distintos
      observados em raw_cnes.estabelecimentos (Rio de Janeiro, competência
      2025-12) foram confirmados contra a tabela. Os códigos 4000, 2305 e
      2313 (juntos, ~28% das linhas — 4000 sozinho é o 2º código mais
      frequente) não foram encontrados na tabela consultada e ficam de
      fora do seed de propósito: o join em stg_cnes__estabelecimentos
      retorna NULL para eles em vez de um rótulo não verificado. Ver regra
      geral em CLAUDE.md#seeds-e-dicionários-externos-de-para.
    columns:
      - name: codigo_natureza_juridica
        data_tests:
          - unique
          - not_null
      - name: descricao_natureza_juridica
        data_tests:
          - not_null

  - name: seed_cnes_tipo_unidade
    description: >
      De-para do código TP_UNID (tipo_unidade) do CNES para descrição
      legível. Fonte: "CNES - Tabela de Tipo de Estabelecimento"
      (https://jundiai.sp.gov.br/saude/wp-content/uploads/sites/17/2014/09/Tabela-de-Tipos-e-Subtipos-de-Estabelecimento-SCNES.pdf,
      reprodução municipal da tabela oficial do CNES/DATASUS, cada código
      citando a Portaria federal que o instituiu — ex. PT SAS 511 de
      29/12/2000, Portaria 198 de 28/03/2008), consultada em 2026-07-05 via
      `pdftotext`. Como o texto extraído por `pdftotext` divergia entre os
      modos `-layout` e `-raw` para os códigos 67/68 (ordem de leitura
      ambígua no stream do PDF), a tabela foi renderizada em imagem
      (`pdftoppm`) e conferida visualmente célula a célula antes de
      transcrever — não só grep pelo código, mas inspeção do layout real.
      Cobertura: 24 dos 33 códigos distintos observados em
      raw_cnes.estabelecimentos (Rio de Janeiro, Paraty, Nova Iguaçu,
      competência 2025-12) foram confirmados contra a tabela (mais 6 códigos
      da tabela não observados no dado atual, incluídos por completude: 01,
      32, 64, 67, 71, 74). Os códigos 16, 77, 79, 80, 81, 82, 83, 84 e 85 —
      típicos de portarias posteriores a 2011, fora do escopo do documento
      consultado — não foram encontrados em nenhuma fonte oficial
      verificável e ficam de fora do seed de propósito: o join em
      stg_cnes__estabelecimentos retorna NULL para eles em vez de um rótulo
      não verificado. Ver regra geral em
      CLAUDE.md#seeds-e-dicionários-externos-de-para.
    columns:
      - name: codigo_tipo_unidade
        data_tests:
          - unique
          - not_null
      - name: descricao_tipo_unidade
        data_tests:
          - not_null

  - name: seed_sisab_tipo_indicador
    description: >
      De-para do codigo_tipo_indicador (10/20/30/40/50/60/70) da API DEMAS
      para o número e a descrição oficial do indicador do Programa Previne
      Brasil. Fonte: notas técnicas da Secretaria de Atenção Primária à
      Saúde/MS linkadas no próprio dataset do DEMAS
      (Nota_tecnica_2022_2024_indicador_{1..7}.pdf, em
      https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/sisab/indicadores_desempenho/),
      consultadas em 2026-07-04 via extração de texto (pdftotext) da seção
      "INDICADOR N" de cada PDF. Cobertura: os 6 códigos observados em
      raw_sisab.indicador_desempenho (Rio de Janeiro, 2024Q3: 10, 20, 30,
      40, 50, 70) foram confirmados um a um contra o PDF correspondente. O
      código 60 (indicador 6) não aparece nos dados reais mas foi incluído
      pra completude, mesma fonte. A correspondência
      codigo_tipo_indicador = numero_indicador * 10 é inferida do padrão
      numérico observado (nenhum endpoint do DEMAS documenta esse mapa
      diretamente) — cada linha foi conferida individualmente, não é só
      uma suposição de fórmula.
    columns:
      - name: codigo_tipo_indicador
        data_tests:
          - unique
          - not_null
      - name: numero_indicador
        data_tests:
          - unique
          - not_null

  - name: seed_fns_ente_municipio
    description: >
      De-para do CNPJ do ente (como o FNS identifica quem recebe o
      repasse) para o id_municipio (código IBGE completo). Fonte: API
      Fundo a Fundo do FNS
      (https://api.transferegov.gestao.gov.br/fundoafundo/gestao_financeira_lancamentos),
      confirmada em 2026-07-04 (Rio de Janeiro) e 2026-07-05 (Paraty, Nova
      Iguaçu) ao consultar nome_ente_solicitante_gestao_financeira pro CNPJ:
      42498733000148 → "MUNICIPIO DE RIO DE JANEIRO", 29172475000147 →
      "MUNICIPIO DE PARATI", 29138278000101 → "MUNICIPIO DE NOVA IGUACU"
      (ver include/collectors/fns/parser.py). Cobertura: 3 de 3 — todos os
      entes no escopo do MVP.
    columns:
      - name: cnpj_ente
        data_tests:
          - unique
          - not_null
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
