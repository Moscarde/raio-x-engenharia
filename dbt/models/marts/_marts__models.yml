version: 2

models:
  - name: dim_municipio
    description: Dimensão de municípios do Brasil (hierarquia territorial completa do IBGE).
    columns:
      - name: id_municipio
        description: Código IBGE completo (7 dígitos). Chave da dimensão.
        data_tests:
          - unique
          - not_null

  - name: dim_estabelecimento
    description: >
      Dimensão de estabelecimentos de saúde do CNES. `nome_fantasia`,
      endereço, geolocalização e `descricao_esfera_administrativa` vêm do
      DEMAS (stg_cnes__estabelecimentos_detalhados) — podem ser `NULL`
      quando o estabelecimento não está nesse cadastro complementar (ver
      ROADMAP.md "Rede CNES detalhada"), por isso sem teste `not_null`.
    columns:
      - name: codigo_cnes
        description: Código CNES do estabelecimento. Chave da dimensão.
        data_tests:
          - unique
          - not_null
      - name: id_municipio
        description: >
          Código IBGE de 7 dígitos, via bridge int_ibge__municipio_codigo6
          (mesmo padrão de fct_internacoes/fct_obitos/fct_nascidos_vivos).
          raw_ibge.municipios cobre o Brasil inteiro, então — ao contrário
          do relationships de codigo_cnes_estabelecimento pro snapshot do
          CNES — não há razão esperada para o join falhar; teste sem
          severity: warn.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: fct_internacoes
    description: Internações hospitalares do SIH (2025, ano completo).
    columns:
      - name: numero_aih
        data_tests:
          - unique
          - not_null
      - name: id_municipio_estabelecimento
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: codigo_cnes_estabelecimento
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimento')
                field: codigo_cnes
              config:
                severity: warn

  - name: fct_obitos
    description: Óbitos do SIM (2024 — último ano publicado no DATASUS).
    columns:
      - name: id_municipio_ocorrencia
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: fct_nascidos_vivos
    description: Nascidos vivos do SINASC (2022 — último ano publicado no DATASUS).
    columns:
      - name: id_municipio_nascimento
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: fct_producao_ambulatorial
    description: >
      Produção ambulatorial do SIA (2025, ano completo, estado do RJ
      inteiro). Materializado incremental por competencia_arquivo (ver
      comentário no .sql) — não table full-refresh, dado o volume
      (99.9M+ linhas).
    columns:
      - name: competencia_arquivo
        data_tests:
          - not_null
      - name: id_municipio_estabelecimento
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: codigo_cnes_estabelecimento
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_estabelecimento')
                field: codigo_cnes
              config:
                severity: warn

  - name: mart_repasses_fns
    description: Lançamentos de Fundo a Fundo do FNS (2025), com município resolvido.
    columns:
      - name: id_lancamento
        data_tests:
          - unique
          - not_null
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: mart_financiamento_saude_siops
    description: RREO-Anexo 14 do SICONFI (2025), formato long (1 linha por conta/coluna).
    columns:
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: mart_indicadores_aps
    description: Indicadores de desempenho do Previne Brasil (2024Q3 — série descontinuada).
    columns:
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: numero_indicador
        data_tests:
          - not_null

  - name: mart_cobertura_aps_municipio
    description: >
      Cobertura de APS e equipes ESF por município — consolida população
      estimada (IBGE), equipes de APS ativas (CNES) e cobertura vinculada
      do Previne Brasil (SISAB/DEMAS). Cada fonte preserva sua própria
      competência; ver ROADMAP.md "Cobertura APS e equipes ESF".
    columns:
      - name: id_municipio
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: populacao_estimada
        data_tests:
          - not_null

  - name: mart_historico_rede_cnes
    description: >
      Série histórica de estabelecimentos do CNES (12 competências de
      2025) com situação operacional derivada (ativo/possivelmente
      encerrado/histórico). Complementa dim_estabelecimento, que só expõe
      o estado mais recente. Ver ROADMAP.md "Histórico de rede CNES".
    columns:
      - name: id_estabelecimento_competencia
        data_tests:
          - unique
          - not_null
      - name: situacao_operacional
        data_tests:
          - accepted_values:
              arguments:
                values: [ativo, possivelmente_encerrado, historico]
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio

  - name: mart_financiamento_saude_uniao
    description: >
      União normalizada de FNS Fundo a Fundo e Portal da Transparência
      (mesma unidade R$, valor líquido com sinal). Não é o total de
      recursos SUS do município — só os canais que as duas APIs federais
      expõem. Ver ROADMAP.md "Financiamento municipal completo".
    columns:
      - name: fonte
        data_tests:
          - accepted_values:
              arguments:
                values: [fns_fundo_a_fundo, portal_transparencia]
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: valor
        data_tests:
          - not_null

  - name: mart_producao_grupo_municipio
    description: >
      Produção ambulatorial do SIA agregada por município (do
      estabelecimento), competência e grupo SIGTAP (2 primeiros dígitos do
      código de 10 dígitos, via seed_sigtap_grupo). Ver ROADMAP.md
      "Produção por grupo".
    columns:
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: competencia_date
        data_tests:
          - not_null
      - name: codigo_grupo
        data_tests:
          - not_null
      - name: descricao_grupo
        data_tests:
          - not_null

  - name: mart_icsap_municipio
    description: >
      Percentual de Internações por Condições Sensíveis à Atenção Primária
      (ICSAP) por município de residência + ano. Denominador simplificado
      (total de internações, não só "internações clínicas" da metodologia
      oficial completa) — ver comentário no `.sql`. Ver ROADMAP.md
      "Internações ICSAP".
    columns:
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: total_internacoes
        data_tests:
          - not_null
      - name: percentual_icsap
        data_tests:
          - not_null

  - name: mart_alertas_saude
    description: >
      Alertas priorizados por regra, sobre marts já existentes. Só regras
      com limiar legal já codificado (SIOPS/LC 141/2012) ou sinal
      estrutural sem limiar (encerramento de unidade, saldo financeiro
      negativo) — sem regras de meta de indicador (ver comentário no
      `.sql` e ROADMAP.md "Alertas priorizados"). `status` sempre "ativo":
      mart full-refresh sem histórico de execuções persistido.
    columns:
      - name: id_alerta
        description: Chave surrogate (regra + município + período).
        data_tests:
          - unique
          - not_null
      - name: codigo_regra
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - siops_abaixo_minimo_constitucional
                  - rede_cnes_possivel_encerramento
                  - financiamento_liquido_negativo
      - name: severidade
        data_tests:
          - accepted_values:
              arguments:
                values: [alta, media, baixa]
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [ativo]

  - name: mart_equipe_aps_detalhada
    description: >
      Detalhamento da APS em grão de equipe/unidade — 1 linha por equipe
      do CNES (grupo "EP"), com a unidade (CNES) e o município resolvidos.
      Sem indicador de desempenho por equipe: a única fonte coletada
      (SISAB indicador_desempenho) agrega por tipo de equipe e município,
      não por equipe individual — ver comentário no `.sql` e ROADMAP.md
      "Detalhamento da APS".
    columns:
      - name: id_equipe
        data_tests:
          - unique
          - not_null
      - name: sigla_equipe
        data_tests:
          - accepted_values:
              arguments:
                values: [eSF, eCR, eAPP, eAP]
      - name: situacao_equipe
        data_tests:
          - accepted_values:
              arguments:
                values: [ativa, desativada]
      - name: id_municipio
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: id_municipio
