version: 2

sources:
  - name: raw_cnes
    schema: raw_cnes
    description: Estabelecimentos de saúde do CNES, carregados por include/collectors/cnes.
    tables:
      - name: estabelecimentos
        description: >
          1 linha por estabelecimento + competência (grupo ST, os 12 meses
          de 2025 — série histórica desde 2026-07-12, ver ROADMAP.md
          "Histórico de rede CNES"). Chave real é (codigo_cnes, competencia),
          já garantida como PRIMARY KEY pelo Postgres; não repetida aqui
          como teste dbt para não duplicar a garantia.
        columns:
          - name: codigo_cnes
            description: Código CNES do estabelecimento. Repete entre competências.
            data_tests:
              - not_null
      - name: equipes_aps
        description: >
          1 linha por equipe de APS (grupo EP, tipos eSF/eCR/eAPP/eAP),
          competência 2025-12 (snapshot único, não historizado como
          estabelecimentos — ver ROADMAP.md "Cobertura APS e equipes ESF").
        columns:
          - name: id_equipe
            description: Identificador da equipe, estável entre competências.
            data_tests:
              - unique
              - not_null
      - name: estabelecimentos_detalhados
        description: >
          1 linha por estabelecimento (cadastro "vivo" do DEMAS, sem
          competência — upsert sobrescreve o estado mais recente). Nome,
          endereço, geolocalização e esfera administrativa decodificada,
          complementando raw_cnes.estabelecimentos (grupo "ST" do FTP, sem
          nome/endereço). Ver ROADMAP.md "Rede CNES detalhada".
        columns:
          - name: codigo_cnes
            data_tests:
              - unique
              - not_null
      - name: rede_porte_municipio
        description: >
          1 linha por município do RJ inteiro (não só os 3 de referência) +
          competência, com a contagem de estabelecimentos do grupo "ST".
          Atributo de porte de rede pra "Comparação entre pares" (ver
          ROADMAP.md) — delete + insert por competência, não série
          histórica.
        columns:
          - name: cod_municipio_ibge6
            data_tests:
              - not_null
