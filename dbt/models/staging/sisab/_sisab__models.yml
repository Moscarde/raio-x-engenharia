version: 2

models:
  - name: stg_sisab__indicador_desempenho
    description: Indicadores de desempenho do Previne Brasil, com nome/descrição do indicador via seed.
    columns:
      - name: numero_indicador
        data_tests:
          - not_null
      - name: codigo_municipio
        data_tests:
          - relationships:
              arguments:
                to: ref('int_ibge__municipio_codigo6')
                field: cod_municipio_ibge6

  - name: stg_sisab__cadastro_vinculado
    description: Cadastro vinculado do Previne Brasil (população por tipo/situação de equipe), tipado.
    columns:
      - name: sigla_equipe
        data_tests:
          - accepted_values:
              arguments:
                values: [eSF, eAP, eAPP, eCR]
      - name: situacao_equipe
        data_tests:
          - accepted_values:
              arguments:
                values: [válidas, homologadas, todas]
      - name: codigo_municipio_ibge
        data_tests:
          - relationships:
              arguments:
                to: ref('int_ibge__municipio_codigo6')
                field: cod_municipio_ibge6
