version: 2

models:
  - name: stg_sim__obitos
    description: Óbitos do SIM, tipados (idade decodificada em unidade + valor).
    columns:
      - name: idade_unidade
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    minutos,
                    horas,
                    dias,
                    meses,
                    anos,
                    anos_mais_de_100,
                    nao_informado,
                  ]
