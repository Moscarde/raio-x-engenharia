# Sem credenciais literais (ver CLAUDE.md, Segurança): host/user/senha vêm
# das mesmas POSTGRES_* que os collectors usam (include/collectors/*/db.py).
# Rodar com: dbt run --project-dir dbt --profiles-dir dbt
raio_x_saude:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging
      threads: 4
